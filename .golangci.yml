version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  enable-build-vcs: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - dogsled
    - dupl
    - embeddedstructfieldcheck
    - errcheck
    - errorlint
    - exhaustive
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    errcheck:
      exclude-functions:
        - '.*\.Close$'
        - '.*\.SetReadDeadline$'
        - '.*\.SetWriteDeadline$'
        - '.*\.Rollback$'
        - '.*\.Release$'
    dupl:
      threshold: 140
    exhaustive:
      check:
        - switch
        - map
    gosec:
      excludes:
        - G101
        - G115
        - G306
        - G401
        - G404
        - G505
    misspell:
      locale: US
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

