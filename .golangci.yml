version: "2"

run:
  timeout: 5m
  relative-path-mode: gomod
  modules-download-mode: readonly
  enable-build-vcs: true

linters:
  default: none
  enable:
    - bodyclose
    - copyloopvar
    - embeddedstructfieldcheck
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nilerr
    - nilnesserr
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    - whitespace
  disable:
    - intrange
    - perfsprint
  settings:
    errcheck:
      exclude-functions:
        - '.*\.Close$'
        - '.*\.SetReadDeadline$'
        - '.*\.SetWriteDeadline$'
        - '.*\.Rollback$'
        - '.*\.Release$'
    gosec:
      excludes:
        - G101 # allow possible credential-looking constants in API/client code
        - G115 # noisy integer conversion checks
        - G306 # file permission noise
        - G401 # legacy crypto may appear in compatibility/client code
        - G404 # allow non-crypto randomness where appropriate
        - G505 # legacy crypto import noise
    misspell:
      locale: US
issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
