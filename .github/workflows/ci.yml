name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    name: Release Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Download modules
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12

      - name: Start broker stack
        run: docker compose up -d

      - name: Run build
        run: go build ./...

      - name: Run default tests
        run: go test ./... -timeout 60s

      - name: Run broker acceptance tests
        run: go test -count=1 -tags=integration ./test -timeout 10m

      - name: Run conformance matrix
        shell: bash
        run: |
          mkdir -p artifacts
          for transport in tcp ws; do
            for auth_mode in anonymous valid_jwt; do
              output="$PWD/artifacts/conformance-${transport}-${auth_mode}.json"
              CONFORMANCE_TRANSPORT="$transport" \
                CONFORMANCE_AUTH_MODE="$auth_mode" \
                CONFORMANCE_OUTPUT="$output" \
                go test -count=1 -tags=integration ./test/conformance/... \
                  -run TestConformanceSuite -timeout 10m
            done
          done

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitz-go-conformance-results
          path: artifacts/conformance-*.json
          if-no-files-found: warn

      - name: Stop broker stack
        if: always()
        run: docker compose down --volumes
